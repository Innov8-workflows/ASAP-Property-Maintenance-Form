<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Temporarily Unavailable | ASAP Property Maintenance Ltd</title>
<meta name="description" content="This page is temporarily unavailable.">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

<style>
  :root{ --navy:#0A1A3A; --navy-deep:#06122A; --gold:#F5B301; --ink:#0d1726; --muted:#5a6b82; --line:#e6ebf2; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink); line-height:1.6;
    background:var(--navy-deep);
    background-image:radial-gradient(1200px 600px at 50% -10%, #12294f 0%, var(--navy-deep) 60%);
    display:flex; align-items:center; justify-content:center;
    padding:28px 20px;
  }
  .card{
    width:100%; max-width:520px; background:#fff; border-radius:20px;
    box-shadow:0 24px 60px rgba(3,10,24,.45);
    padding:44px 36px 32px; text-align:center;
  }
  .logo{ height:64px; width:auto; border-radius:10px; display:block; margin:0 auto 26px; }
  .rule{ width:52px; height:4px; border-radius:50px; background:var(--gold); margin:0 auto 24px; }
  h1{
    font-family:'Plus Jakarta Sans','Inter',sans-serif; font-weight:800;
    color:var(--navy); letter-spacing:-.02em; line-height:1.2;
    font-size:clamp(1.45rem,5vw,1.85rem); margin-bottom:14px;
  }
  p{ color:var(--muted); font-size:1.02rem; max-width:40ch; margin:0 auto; }
  .foot{
    margin-top:30px; padding-top:20px; border-top:1px solid var(--line);
    font-size:.82rem; color:#8b98aa;
  }
  @media(max-width:420px){
    .card{ padding:34px 22px 26px; border-radius:16px; }
    .logo{ height:54px; margin-bottom:20px; }
  }
</style>
</head>
<body>

  <main class="card">
    <img class="logo" src="assets/logo.jpg" alt="ASAP Property Maintenance Ltd">
    <div class="rule"></div>
    <h1>This page is temporarily unavailable</h1>
    <p>We're sorry for the inconvenience. Please check back again shortly.</p>
    <div class="foot">&copy; <span id="yr">2026</span> ASAP Property Maintenance Ltd</div>
  </main>

  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
